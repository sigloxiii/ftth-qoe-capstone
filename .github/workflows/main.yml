name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy jupyter nbconvert ipykernel
          # si tienes requirements.txt descomenta:
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify data files
        run: |
          ls -lh data/
          echo "--- fiber_units ---"
          head -n 3 data/fiber_units.csv
          wc -l data/*.csv

      - name: Run notebooks
        run: |
          jupyter nbconvert --to notebook --execute python/01_process.ipynb --output /tmp/executed.ipynb --debug

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: /tmp/executed.ipynb
